name: Deploy to Test Server

on:
  push:
    branches:
      - test

concurrency:
  group: deploy-test-crm-be
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy to Test
    needs: [ci]
    runs-on: self-hosted
    environment: test
    timeout-minutes: 15

    permissions:
      contents: read

    env:
      DEPLOY_APP_DIR: ${{ vars.DEPLOY_APP_DIR }}
      SYSTEMD_SERVICE: ${{ vars.SYSTEMD_SERVICE }}
      HEALTH_CHECK_URL: ${{ vars.HEALTH_CHECK_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Validate deploy configuration
        run: |
          if [ -z "$DEPLOY_APP_DIR" ]; then
            echo "Set Environment variable DEPLOY_APP_DIR (e.g. /var/www/testcrm.umram.online/crm-be)"
            exit 1
          fi
          if [ -z "$HEALTH_CHECK_URL" ]; then
            echo "Set Environment variable HEALTH_CHECK_URL (e.g. https://uitest.umranoto.com/)"
            exit 1
          fi

      - name: Add SSH key
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.TEST_SSH_PRIVATE_KEY }}

      - name: Add server to known_hosts
        run: ssh-keyscan -H ${{ secrets.TEST_SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy via SSH
        env:
          SSH_USER: ${{ secrets.TEST_SSH_USER }}
          SSH_HOST: ${{ secrets.TEST_SSH_HOST }}
        run: |
          ssh "${SSH_USER}@${SSH_HOST}" bash -s << ENDSSH
            set -e
            cd "${DEPLOY_APP_DIR}"

            git pull origin test
            go mod download
            go build -o app ./cmd/api
            chmod +x app

            SERVICE="${SYSTEMD_SERVICE:-crm-api}"
            if command -v systemctl >/dev/null 2>&1 && systemctl list-unit-files --type=service 2>/dev/null | grep -q "^\${SERVICE}.service"; then
              sudo systemctl restart "\${SERVICE}"
            else
              echo "systemd unit \${SERVICE} not found; binary updated at \$(pwd)/app — restart the API process manually"
            fi

            echo "Test deployment complete"
          ENDSSH

      - name: Health check
        run: |
          URL="${HEALTH_CHECK_URL}"
          for attempt in 1 2 3 4 5; do
            if curl -fsS --max-time 15 "$URL" > /dev/null; then
              echo "Health check passed: $URL"
              exit 0
            fi
            echo "Attempt ${attempt}/5 failed, retrying in 5s..."
            sleep 5
          done
          echo "Health check failed: $URL"
          exit 1
